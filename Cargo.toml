[package]
name = "kopsi-200-pcap-parser"
version = "0.1.0"
edition = "2021"

[dependencies]
memmap2 = "0.9.11"
memchr = "2.8.2"
core_affinity = "0.8.3"

[dev-dependencies]
chrono = "0.4.38"
criterion = { version = "0.5", features = ["html_reports"] }
pcap-parser = { version = "0.16.0", features = ["data"] }

[[bench]]
name = "benchmark"
harness = false

[lib]
bench = false

[profile.release]
debug = true
codegen-units = 1
lto = "fat"
